cat << 'EOF' > Cargo.toml
[package]
name = "voice_sentry"
version = "0.2.0"
edition = "2021"

[dependencies]
ort = { version = "2.0.0-rc.9", features = ["ndarray", "load-dynamic"], default-features = false }
ndarray = { version = "0.17", default-features = false }
serialport = { version = "4", default-features = false }
ctrlc = { version = "3", features = ["termination"] }
anyhow = { version = "1.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
debug-assertions = false
overflow-checks = false

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=cortex-a72",
]

EOF
